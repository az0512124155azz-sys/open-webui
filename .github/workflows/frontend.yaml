# ─────────────────────────────────────────────────────────────────────────────
# Frontend CI — Lint, format check, build, and unit tests
# Runs on pushes and PRs to main/dev, skipping backend-only changes
# ─────────────────────────────────────────────────────────────────────────────
name: Frontend Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format, i18n, and production build ────────────────────────────────────
  format-and-build:
    name: Format & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Verify code formatting
        run: npm run format

      - name: Verify i18n strings
        run: npm run i18n:parse

      - name: Synchronize generated files for custom fork branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/custom-fork-v1'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Generated files are already synchronized.'
            exit 0
          fi
          echo 'Synchronizing generated/formatted frontend files:'
          git status --short
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src package.json package-lock.json i18next-parser.config.ts
          git commit -m 'chore: synchronize formatted frontend and i18n files'
          git push origin HEAD:feature/custom-fork-v1

      - name: Ensure working tree is clean
        shell: bash
        run: |
          if ! git diff --quiet; then
            echo 'Generated or formatted files are out of sync:'
            git status --short
            git diff --stat
            git diff -- . ':(exclude)package-lock.json'
            exit 1
          fi

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # ── Vitest unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies (frozen lockfile)
        run: npm ci --force

      - name: Execute test suite
        run: npm run test:frontend
