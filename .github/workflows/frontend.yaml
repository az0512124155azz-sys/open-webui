# ─────────────────────────────────────────────────────────────────────────────
# Frontend CI — Lint, format check, build, and unit tests
# Runs on pushes and PRs to main/dev, skipping backend-only changes
# ─────────────────────────────────────────────────────────────────────────────
name: Frontend Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format, i18n, and production build ────────────────────────────────────
  format-and-build:
    name: Format & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --force

      - name: Verify code formatting
        run: npm run format

      - name: Verify i18n strings
        run: npm run i18n:parse

      - name: Ensure working tree is clean
        shell: bash
        run: |
          if ! git diff --quiet; then
            echo 'Generated or formatted files are out of sync:'
            git status --short
            git diff --stat
            git diff -- . ':(exclude)package-lock.json'
            exit 1
          fi

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # ── Vitest unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies (frozen lockfile)
        run: npm ci --force

      - name: Execute test suite
        run: npm run test:frontend
