services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    environment:
      - 'OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE--1}'
      - 'OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION-1}'
      - 'OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL-2}'

  libretranslate:
    image: libretranslate/libretranslate:v1.6.0
    container_name: libretranslate
    restart: unless-stopped
    ports:
      - '127.0.0.1:${LIBRETRANSLATE_PORT-5000}:5000'
    environment:
      - 'LT_LOAD_ONLY=en,he'
      - 'LT_DISABLE_WEB_UI=false'
      - 'LT_UPDATE_MODELS=true'
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:5000/health >/dev/null &&
          curl -fsS -X POST http://localhost:5000/translate
          -H 'Content-Type: application/json'
          -d '{"q":"שלום","source":"he","target":"en","format":"text"}' >/dev/null &&
          curl -fsS -X POST http://localhost:5000/translate
          -H 'Content-Type: application/json'
          -d '{"q":"hello","source":"en","target":"he","format":"text"}' >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
      - libretranslate
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE--1}'
      - 'OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION-1}'
      - 'OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL-2}'
      - 'LIBRETRANSLATE_URL=http://libretranslate:5000'
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  libretranslate-models: {}
  open-webui: {}
